[project]
name = "ryu-markitdown-sidecar"
version = "0.1.0"
description = "Ryu's Core-managed MarkItDown document-parsing sidecar (document.parse backend)"
requires-python = ">=3.10"
# Base server deps only. `markitdown` itself is optional so the process boots and
# answers /health + /capability on any machine — that is how a user finds out the
# install has not finished. A missing parse dep becomes a typed per-job error,
# never a boot crash.
dependencies = [
    # FastAPI 0.133 is the first release that accepts Starlette 1.x; Starlette 1.3.1
    # fixes the multipart, Range, Host/path-reconstruction, and HTTPEndpoint advisories
    # (PYSEC-2026-161/248/249/1941/1942/1943/2280/2281) every older floor admitted.
    "fastapi>=0.133.0",
    "starlette>=1.3.1",
    "uvicorn>=0.29",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# `pip install -e ".[all]"` — the manifest's `pyproject_extra`. Pure Python, tens
# of megabytes, no native toolchain and no model download. That is the whole
# reason this backend is the `document.parse` default.
all = ["markitdown[all]>=0.1.0"]
# Narrower installs for users who know their corpus. The extras are MarkItDown's
# own: pptx, docx, xlsx, xls, pdf, outlook, az-doc-intel, audio-transcription,
# youtube-transcription.
office = ["markitdown[docx,pptx,xlsx,xls]>=0.1.0"]
pdf = ["markitdown[pdf]>=0.1.0"]

[project.scripts]
ryu-markitdown = "ryu_markitdown.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryu_markitdown"]
